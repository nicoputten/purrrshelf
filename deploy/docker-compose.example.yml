# Example stack: CWA + SABnzbd + broker. Placeholders only.
# Copy next to a filled-in .env and adjust the host paths for your server.
# Everything runs as UID/GID 568 ("apps" on TrueNAS), so files the broker
# drops into the ingest folder are readable by CWA.
services:
  broker:
    image: ghcr.io/OWNER/purrshelf-broker:latest
    user: '568:568'
    env_file: .env
    restart: unless-stopped
    # LAN only. Remote access goes through Nginx Proxy Manager with HTTPS and
    # HSTS (deploy/reverse-proxy.md); never forward this port on the router.
    ports:
      - '8080:8080'
    volumes:
      - /path/to/broker-data:/data
      - /path/to/calibre-library:/calibre-library:ro
      - /path/to/cwa-config:/cwa-config:ro
      - /path/to/cwa-ingest:/cwa-book-ingest
      - /path/to/sabnzbd/complete/kobopush:/downloads:ro

  cwa:
    # Keep in step with test/stack (ADR 0017).
    image: crocodilestick/calibre-web-automated:v4.0.8
    restart: unless-stopped
    environment:
      - PUID=568
      - PGID=568
      - TZ=Etc/UTC
    volumes:
      - /path/to/cwa-config:/config
      - /path/to/calibre-library:/calibre-library
      - /path/to/cwa-ingest:/cwa-book-ingest
    # LAN only: no proxy host and no router port forward (ADR 0011).
    ports:
      - '8083:8083'

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    restart: unless-stopped
    environment:
      - PUID=568
      - PGID=568
      - TZ=Etc/UTC
    volumes:
      - /path/to/sabnzbd-config:/config
      - /path/to/sabnzbd/complete:/downloads
