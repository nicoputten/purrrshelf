name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      broker_released: ${{ steps.release.outputs['apps/broker--release_created'] }}
      broker_version: ${{ steps.release.outputs['apps/broker--version'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  broker-image:
    needs: release-please
    if: needs.release-please.outputs.broker_released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/broker/Dockerfile
          push: true
          build-args: BROKER_VERSION=${{ needs.release-please.outputs.broker_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/purrshelf-broker:${{ needs.release-please.outputs.broker_version }}
            ghcr.io/${{ github.repository_owner }}/purrshelf-broker:latest
