name: Android APK

# Builds a sideloadable APK on mobile release tags (created by release-please).
on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @purrshelf/contract build
      - name: Generate the native project
        working-directory: apps/mobile
        run: pnpm expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: apps/mobile/android
        # Signed with the debug key for sideloading; Play Store signing comes later.
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: purrshelf-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" apps/mobile/android/app/build/outputs/apk/release/*.apk --clobber
