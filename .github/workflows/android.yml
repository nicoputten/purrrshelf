name: Android APK

# Builds a sideloadable APK (ADR 0028, 0030).
# - Release: called by release.yml when release-please cuts a mobile release
#   (tags pushed with GITHUB_TOKEN never trigger other workflows, so the tag
#   trigger below only fires for tags pushed by hand). Attaches the APK to the
#   GitHub release.
# - Test: run by hand from the Actions tab.
# Every build makes arm64-v8a only (the phones we use), which skips three
# quarters of the native compile and shares one cache. All four ABIs are a
# choice in the Actions tab.
on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      abis:
        description: ABIs to build (arm64-v8a is enough for a phone)
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a,arm64-v8a,x86,x86_64
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the APK to
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: android-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  ABIS: ${{ inputs.abis || 'arm64-v8a' }}
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Caches the Gradle distribution, dependencies and build cache between
      # runs (written from main, read-only elsewhere).
      - uses: gradle/actions/setup-gradle@v5
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-${{ env.ABIS }}
          max-size: 1G
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @purrshelf/contract build
      - name: Generate the native project
        working-directory: apps/mobile
        run: pnpm expo prebuild --platform android --no-install
      - name: Build release APK (${{ env.ABIS }})
        working-directory: apps/mobile/android
        env:
          # React Native's CMake setup picks up ccache when it is on PATH.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        # Signed with the debug key for sideloading; Play Store signing comes later.
        run: >-
          ./gradlew assembleRelease
          -PreactNativeArchitectures=${{ env.ABIS }}
          --build-cache --parallel
      - uses: actions/upload-artifact@v7
        with:
          name: purrshelf-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
      - name: Attach to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" apps/mobile/android/app/build/outputs/apk/release/*.apk --clobber --repo "$GITHUB_REPOSITORY"
