name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL --retry 3 --retry-all-errors --max-time 120 -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --redact --no-banner --verbose .

  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and API tests with coverage
        run: pnpm test:coverage
      - name: Bundle the Android app (catches Metro and routing errors)
        run: pnpm --filter @purrshelf/mobile exec expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore

  cwa-contract:
    name: CWA contract tests (v4.0.8)
    runs-on: ubuntu-latest
    env:
      CWA_STACK_DIR: ${{ github.workspace }}/.cwa-stack
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @purrshelf/contract build
      - name: Start CWA and recreate the server setup (ADR 0017, 0021)
        run: pnpm --filter @purrshelf/broker cwa:fixture
      - name: Contract tests
        run: pnpm --filter @purrshelf/broker test:contract
      - name: CWA logs
        if: failure()
        run: docker compose -f test/stack/docker-compose.yml logs --tail 300

  broker-image:
    name: Broker Docker image
    runs-on: ubuntu-latest
    needs: [secrets, checks]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/purrshelf-broker
          tags: |
            type=sha
            type=edge,branch=main
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/broker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BROKER_VERSION=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        if: github.event_name != 'push'
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name broker -p 8080:8080 -e JWT_SECRET="$(openssl rand -hex 32)" "$image"
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs broker
          exit 1
