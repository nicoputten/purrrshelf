# Installed by `pnpm install` (see the root "prepare" script).
pre-commit:
  commands:
    gitleaks:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "gitleaks is not installed. Install it (https://github.com/gitleaks/gitleaks#installing) so secrets are caught before they are committed." >&2
          exit 1
        fi
        gitleaks git --pre-commit --staged --redact --no-banner .
    prettier:
      glob: '*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml}'
      run: pnpm exec prettier --check {staged_files}
